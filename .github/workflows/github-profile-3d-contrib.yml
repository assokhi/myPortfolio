name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC — keeps the skyline self-updating
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git add -f ./profile-3d-contrib/*.svg
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update 3D contribution graph" -a || echo "nothing to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
