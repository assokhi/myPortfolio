name: Refresh stats

# The GitHub/LeetCode/Codeforces numbers are baked into the static export at
# build time, so "fresh stats" means "rebuild". This workflow does not deploy
# anything itself — it only POSTs a Cloudflare Deploy Hook, which starts the
# same Workers Build a push to main starts. One deployment pipeline, two
# triggers.
#
# Requires the repository secret CLOUDFLARE_DEPLOY_HOOK_URL:
#   Cloudflare dashboard > Workers & Pages > portfolio > Settings > Builds >
#   Deploy Hooks > create one for branch `main`, copy the URL.

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch: # manual "refresh now" from the Actions tab

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Workers Build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not set — skipping." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK" -o /dev/null
          echo "Rebuild requested."
