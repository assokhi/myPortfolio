<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- sLime: a video frame mid-recovery. The band is where packets were lost —
       two blocks rebuilt, one still gone — and the playhead on the timeline is
       the same x as the recovery edge, which is the "real-time" half of the
       claim. The earlier cell grid read as a calendar heatmap; this does not. -->
  <defs>
    <linearGradient id="sl-ground" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F0F12" />
      <stop offset="1" stop-color="#1A1A20" />
    </linearGradient>
    <pattern id="sl-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <clipPath id="sl-frame">
      <rect x="140" y="104" width="520" height="242" rx="22" />
    </clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#sl-ground)" />
  <rect width="800" height="450" fill="url(#sl-grid)" />

  <g clip-path="url(#sl-frame)">
    <circle cx="242" cy="178" r="28" fill="#FFFFFF" fill-opacity="0.13" />
    <path d="M140 346 268 214 356 300 470 196 660 346Z" fill="#FFFFFF" fill-opacity="0.11" />

    <rect x="386" y="104" width="84" height="242" fill="url(#sl-ground)" />
    <rect x="394" y="124" width="68" height="58" rx="10" fill="#3FE0A3" fill-opacity="0.85" />
    <rect x="394" y="190" width="68" height="58" rx="10" fill="#3FE0A3" fill-opacity="0.85" />
    <rect x="394" y="256" width="68" height="58" rx="10" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 8" />
  </g>

  <rect x="140" y="104" width="520" height="242" rx="22" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4.5" />

  <g stroke-linecap="round">
    <path d="M176 322h448" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5" />
    <path d="M176 322h294" stroke="#3FE0A3" stroke-width="5" />
    <path d="M470 116v206" stroke="#3FE0A3" stroke-opacity="0.5" stroke-width="3" />
    <circle cx="470" cy="322" r="9" fill="#3FE0A3" />
  </g>

  <rect width="800" height="1.5" fill="#FFFFFF" fill-opacity="0.07" />
</svg>
