<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Chad: two sides of a conversation with the lock sitting ON the channel
       between them rather than pinned to a corner as a badge. The disc behind
       the lock is filled with the ground gradient itself, so it punches a clean
       hole through both bubbles without a seam. -->
  <defs>
    <linearGradient id="cd-ground" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F0F12" />
      <stop offset="1" stop-color="#1A1A20" />
    </linearGradient>
    <pattern id="cd-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cd-ground)" />
  <rect width="800" height="450" fill="url(#cd-grid)" />

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 100h194a28 28 0 0 1 28 28v62a28 28 0 0 1-28 28H196l-42 32v-32a28 28 0 0 1-28-28v-62a28 28 0 0 1 28-28Z" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4.5" />
    <path d="M164 142h140M164 176h92" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4.5" />

    <path d="M452 232h194a28 28 0 0 1 28 28v32a28 28 0 0 1-28 28v32l-42-32H452a28 28 0 0 1-28-28v-32a28 28 0 0 1 28-28Z" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="4" />
    <path d="M462 268h140M462 300h92" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4.5" />

    <circle cx="400" cy="225" r="58" fill="url(#cd-ground)" />
    <rect x="370" y="218" width="60" height="50" rx="13" stroke="#A78BFA" stroke-width="4.5" />
    <path d="M385 218v-18a15 15 0 0 1 30 0v18" stroke="#A78BFA" stroke-width="4.5" />
    <circle cx="400" cy="243" r="5.5" fill="#A78BFA" />
  </g>

  <rect width="800" height="1.5" fill="#FFFFFF" fill-opacity="0.07" />
</svg>
