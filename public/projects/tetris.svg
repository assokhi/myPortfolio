<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Tetris (a Pong server): the rally itself — the court, both paddles, the
       net, and the ball mid-flight after a bounce. The court frame is what
       holds the composition together at card size, where three loose elements
       in a void read as nothing. -->
  <defs>
    <linearGradient id="tt-ground" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F0F12" />
      <stop offset="1" stop-color="#1A1A20" />
    </linearGradient>
    <pattern id="tt-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#tt-ground)" />
  <rect width="800" height="450" fill="url(#tt-grid)" />

  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="110" y="76" width="580" height="298" rx="22" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" />
    <path d="M400 104V346" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="12 20" />

    <path d="M152 240 352 118 612 300" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3.5" stroke-dasharray="10 16" />
    <path d="M498 218 538 246" stroke="#D8F14B" stroke-opacity="0.4" stroke-width="9" />

    <rect x="134" y="182" width="18" height="116" rx="9" fill="#FFFFFF" fill-opacity="0.85" />
    <rect x="648" y="234" width="18" height="116" rx="9" fill="#FFFFFF" fill-opacity="0.85" />

    <circle cx="556" cy="260" r="16" fill="#D8F14B" />
  </g>

  <rect width="800" height="1.5" fill="#FFFFFF" fill-opacity="0.07" />
</svg>
