<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Kitten: the page on the left, the same content as sound on the right. The
       single gradient is the transformation — it is the subject, not decoration. -->
  <defs>
    <linearGradient id="kt-ground" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F0F12" />
      <stop offset="1" stop-color="#1A1A20" />
    </linearGradient>
    <pattern id="kt-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <linearGradient id="kt-wave" x1="368" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="1" stop-color="#D8F14B" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#kt-ground)" />
  <rect width="800" height="450" fill="url(#kt-grid)" />

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 128a18 18 0 0 1 18-18h96l62 62v168a18 18 0 0 1-18 18H162a18 18 0 0 1-18-18Z" fill="#121216" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4.5" />
    <path d="M258 110v44a18 18 0 0 0 18 18h44" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4.5" />
    <path d="M176 214h116M176 246h116M176 278h72" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="4.5" />

    <g stroke="url(#kt-wave)" stroke-width="9">
      <path d="M368 208v34M400 190v70M432 160v130M464 200v50M496 138v174M528 176v98M560 122v206M592 168v114M624 196v58M656 214v22" />
    </g>
  </g>

  <rect width="800" height="1.5" fill="#FFFFFF" fill-opacity="0.07" />
</svg>
