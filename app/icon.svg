<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Arvinder Singh Sokhi">
  <!-- The site's lime bento fill with the on-bright ink: the one pairing in
       the palette that stays legible against a light AND a dark browser tab
       strip, which a near-black mark does not. Written without a double hyphen
       anywhere in this comment, because that is illegal in XML and makes the
       whole file fail to parse. -->
  <rect width="64" height="64" rx="14" fill="#d8f14b"/>
  <!-- textLength plus lengthAdjust pin the glyph box, so the mark renders at
       the same width wherever the system sans differs. Favicons get no
       webfonts. -->
  <text x="32" y="44"
        text-anchor="middle"
        textLength="40" lengthAdjust="spacingAndGlyphs"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700"
        fill="#0a0a0b">AS</text>
</svg>
